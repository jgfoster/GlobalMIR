name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a published score is always reproducible from the source.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The scoring rules are the point of this application: a failing test
      # must block the deploy.
      - run: flutter test

      # Project pages are served from /GlobalMIR/, not the domain root.
      - run: flutter build web --release --base-href /GlobalMIR/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
